[package]
name = "syspeek"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fast, readable, cross-platform system inspection for developer machines"
readme = "README.md"
license = "MIT"
repository = "https://github.com/joshiii-xyz/syspeek"
keywords = ["system-information", "system-monitor", "diagnostics", "cli", "cross-platform"]
categories = ["command-line-utilities", "os"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.39.6"

[dev-dependencies]
assert_cmd = "2.0.17"
divan = "0.1.21"
predicates = "3.1.3"

[[bench]]
name = "snapshot"
harness = false
